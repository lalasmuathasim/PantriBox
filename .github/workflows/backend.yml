name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Unit tests do not connect to PostgreSQL, but configuration must remain explicit.
      PANTRIBOX_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/pantribox_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff format check
        run: |
          . .venv/bin/activate
          ruff format --check .

      - name: Ruff lint
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest
